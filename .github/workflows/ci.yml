name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --only-group dev ruff check .
      - run: uv run --only-group dev ruff format --check .
      # Every spec in docs/specs/ has the required sections and a valid status.
      - run: python3 scripts/specs.py check

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs derives the version from git tags
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      # Golden tests skip themselves here: LATERANK_GOLDEN_DIR is not set in CI.
      - run: uv run pytest -ra

  test-floor:
    name: test floor (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      # The oldest numpy and scipy that pyproject.toml allows.
      # Exact pins: "1.16.*" could resolve to a later 1.16.x, not the floor itself.
      - run: uv run --with "numpy==2.2.0" --with "scipy==1.16.0" python -c "import numpy, scipy; assert (numpy.__version__, scipy.__version__) == ('2.2.0', '1.16.0'), (numpy.__version__, scipy.__version__)"
      - run: uv run --with "numpy==2.2.0" --with "scipy==1.16.0" pytest -ra
